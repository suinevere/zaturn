[project]
name = "saturn-translate-mcp"
version = "0.1.0"
description = "MCP server for translating Sega Saturn games from Japanese to English. Provides Saturn-specific tooling (ISO parsing, Shift-JIS text extraction, SH-2 pointer-table handling, text reinsertion, disc repacking) and orchestrates ghidra-mcp and textra-ja-to-en-mcp."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saturn Translate MCP" }]
keywords = ["mcp", "sega-saturn", "translation", "rom-hacking", "shift-jis", "ghidra"]

dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
# What tools/mapscan.py and tools/gen_map_atlas.py read the InvisiClues scans
# with. Optional because nothing on the disc needs them at build time -- but
# six test modules and the generator/Python destination cross-check cannot run
# without them, and they were recorded nowhere but a docstring until now.
maps = [
    "opencv-python>=4.9.0",
    "pymupdf>=1.24.0",
    "numpy>=1.26.0",
]

[project.scripts]
saturn-translate-mcp = "saturn_translate.server:main"
saturn-translate-cli = "saturn_translate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["saturn_translate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
