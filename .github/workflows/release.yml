name: Build & release Saturn disc

# Tag pushes (v*) build, package, and attach the cue/bin to a release —
# creating the release if one does not exist yet. Manual runs build and
# upload the package as a workflow artifact for testing without cutting a
# release.
on:
  push:
    # Match both v-prefixed (v1.0.0) and bare semver (1.0.0) tags.
    tags: ['v*', '[0-9]*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create / upload to releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with SaturnRingLib submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host tools
        # xorriso provides xorrisofs (ISO authoring); sox converts the boot
        # splash jingle to raw PCM (see the pvms step below); the rest are for
        # the toolchain fetch scripts and packaging. No ffmpeg: this disc has
        # no CDDA audio track.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xorriso wget unzip zip sox

      # Cache the fetched SH-2 gcc + iso2raw so we don't re-download ~hundreds
      # of MB every run. Keyed on the tool versions below.
      - name: Cache SaturnRingLib toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            SaturnRingLib/Compiler
            SaturnRingLib/tools/bin
          key: srl-toolchain-gcc14.2.0-iso2raw0.2.2

      - name: Fetch SH-2 toolchain + iso2raw
        # Only on a cache miss: the fetch scripts prompt interactively if their
        # target dirs already exist, which would hang CI.
        if: steps.toolchain.outputs.cache-hit != 'true'
        working-directory: SaturnRingLib
        run: |
          set -e
          bash tools/scripts/getcompiler.sh 14.2.0
          bash tools/scripts/getiso2raw.sh v0.2.2

      # compile.bat is the same script a developer runs locally, and it is the only
      # place that encodes netbin-first / CD-second. That order is not cosmetic: both
      # configs write the same BuildDrop/<CD_NAME>.elf/.iso/.bin/.cue and only
      # zaturn.netbin has a name of its own, so a CD-last run is what leaves the real
      # disc on disk. It also calls pvms itself and skips the CD pass if the netbin
      # fails. Calling it here rather than restating that order in YAML keeps the
      # ordering and the reason for it in one file.
      - name: Build netbin and Saturn disc (release)
        working-directory: saturn
        run: bash compile.bat release

      # pvms warns rather than fails when sox is missing, and the netbin's size limit
      # is enforced inside post.makefile, so assert the artifacts rather than trusting
      # either exit code. Existence alone can't catch a netbin-last overwrite: the
      # netbin pass also produces a non-empty .iso/.bin/.cue under the same shared
      # names, it's just netbin-linked content instead of the CD payload.
      - name: Assert build outputs
        run: |
          set -e
          test -s "saturn/cd/data/MSC/SPLASH.PCM"
          test -s "saturn/BuildDrop/zaturn.netbin"
          sz=$(stat -c%s "saturn/BuildDrop/zaturn.netbin")
          echo "zaturn.netbin: $sz bytes"
          test "$sz" -le 409600
          test -s "saturn/BuildDrop/Zaturn (USA) (Netlink Edition).bin"
          test -s "saturn/BuildDrop/Zaturn (USA) (Netlink Edition).cue"
          test -s "saturn/BuildDrop/Zaturn (USA) (Netlink Edition).iso"

      # The disc files above only prove packaging didn't silently fail -- a
      # netbin-last overwrite also produces non-empty .iso/.bin/.cue under the
      # same shared BuildDrop/<CD_NAME> names, so this is the check that actually
      # tells a real CD build apart from a netbin overwrite. It deliberately does
      # NOT use a measured size floor: an earlier version of this assertion
      # compared the .iso's byte size against a value measured from one real
      # build, but that number erodes as cd/data grows -- both orders' sizes grow
      # together, so a size floor eventually stops discriminating without anyone
      # noticing. This checks the ELF's actual link target instead, which does
      # not drift with content: compile.bat's header records that the CD build
      # links at the stock SaturnRingLib base 0x06004000 while the netbin build
      # links at 0x06010000 via sgl-netbin.linker (saturn/sgl-netbin.linker:4).
      # Both addresses were confirmed empirically, not trusted from the comment,
      # by dumping `readelf -l` against the real BuildDrop/<CD_NAME>.elf from both
      # a correct-order and a swapped-order run. The correct-order artifact is
      # valid ELF with a LOAD segment at 0x06004000. The swapped-order artifact
      # is not even parseable as ELF: because the SGL libraries linked here
      # (LIBCPK.A, SEGA_SYS.A, LIBCD.A, LIBSGL.A, LIBSND.A) are original Sega COFF
      # archives pulled in via `-Wl,-bcoff-sh`, when the netbin link (which uses
      # sgl-netbin.linker and omits LIBSND.A) runs last, the linker leaves a COFF
      # container at the .elf path instead of ELF -- readelf itself fails with
      # "wrong magic bytes". So this assertion fails on a netbin-last overwrite
      # either way: readelf errors outright, or if it somehow produced a readable
      # file, that file's LOAD segment would not be 0x06004000.
      - name: Assert CD ELF link address
        run: |
          set -e
          readelf -l "saturn/BuildDrop/Zaturn (USA) (Netlink Edition).elf" | grep -q "0x06004000"

      - name: Package release zip
        id: package
        run: |
          set -e
          # Tag-driven runs use the tag as the release id; manual runs use the SHA.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="${GITHUB_SHA::7}"
          fi
          NAME="Zaturn (USA) (Netlink Edition)"
          # Stage the burnable disc files flat: cue + MODE1/2352 raw track.
          # The Makefile's CD_NAME already produces these names, so this is a
          # straight copy; the cue's FILE line is normalized anyway so a future
          # CD_NAME change can't ship a cue pointing outside the zip.
          STAGE="$RUNNER_TEMP/release-stage"
          mkdir -p "$STAGE"
          cp "saturn/BuildDrop/${NAME}.bin" "$STAGE/${NAME}.bin"
          sed -E 's/^([[:space:]]*FILE[[:space:]]+")[^"]*(")/\1'"${NAME}"'.bin\2/' \
            "saturn/BuildDrop/${NAME}.cue" > "$STAGE/${NAME}.cue"
          grep -q "FILE \"${NAME}.bin\" BINARY" "$STAGE/${NAME}.cue"
          # One zip, files at its root -- unzip yields the files directly:
          # no nested zip, no wrapper folder. The .zip is the release asset;
          # the workflow-artifact upload uses the same staged folder.
          mkdir -p "$RUNNER_TEMP/${NAME}"
          (cd "$STAGE" && zip -r "$RUNNER_TEMP/${NAME}/${NAME} - ${VER}.zip" .)
          echo "stage_dir=$STAGE"                  >> "$GITHUB_OUTPUT"
          echo "artifact_name=${NAME} - ${VER}"             >> "$GITHUB_OUTPUT"
          echo "zip_path=$RUNNER_TEMP/${NAME}/${NAME} - ${VER}.zip" >> "$GITHUB_OUTPUT"

      - name: Package build-it-yourself kit
        id: kit
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VER="${GITHUB_REF_NAME}"; else VER="${GITHUB_SHA::7}"; fi
          # Stage the kit contents flat at the zip root (no wrapper folder).
          STAGE="$RUNNER_TEMP/kit-stage"
          
          # Original iso + raw track, in the folder CONFIG.ME's BASE_ISO expects.
          DISC="Zaturn (USA) (Netlink Edition)"
          mkdir -p "$STAGE/$DISC"
          cp "saturn/BuildDrop/${DISC}.iso" "$STAGE/$DISC/${DISC}.iso"
          cp "saturn/BuildDrop/${DISC}.bin" "$STAGE/$DISC/${DISC}.bin"
          
          # Scripts + libs + bundled tools + config + docs + empty working dirs.
          cp -r tools/assets/. "$STAGE/"
          rm -rf "$STAGE/png"
          rm -rf "$STAGE/tests"
          # Both are gitignored, so a CI checkout never has them -- this is for a
          # packaging run on a working tree that has already built a disc. BG is
          # the extracted room-background archives (2 MB, and the end user's own
          # bg.bat re-fetches them); cache is the several-hundred-megabyte disc
          # download those archives came out of.
          rm -rf "$STAGE/BG"
          rm -rf "$STAGE/cache"

          
          # Ensure working dirs exist but are empty save for .gitkeep.
          for d in game audio output; do mkdir -p "$STAGE/$d"; find "$STAGE/$d" -type f ! -name .gitkeep -delete; done
          NAME="Zaturn Complete Patch (${VER})"

          (cd "$STAGE" && zip -rq "$RUNNER_TEMP/${NAME}.zip" .)
          echo "stage_dir=$STAGE"                  >> "$GITHUB_OUTPUT"
          echo "artifact_name=${NAME}"             >> "$GITHUB_OUTPUT"
          echo "zip_path=$RUNNER_TEMP/${NAME}.zip" >> "$GITHUB_OUTPUT"

      # Manual runs: surface the build as a workflow artifact for inspection.
      - name: Upload as workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.stage_dir }}

      - name: Upload kit as workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.kit.outputs.artifact_name }}
          path: ${{ steps.kit.outputs.stage_dir }}

      # Tag runs: attach to a release, creating it if missing.
      - name: Attach to GitHub release (tag runs)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Automated Saturn disc build from $TAG. Burn/mount cue/bin. See README for setup."
          fi
          gh release upload "$TAG" "${{ steps.package.outputs.zip_path }}" --clobber
          gh release upload "$TAG" "${{ steps.kit.outputs.zip_path }}" --clobber
          gh release upload "$TAG" "saturn/BuildDrop/zaturn.netbin" --clobber

      # Tells suin-uk a new pair is available. Deliberately last: a dispatch fired
      # before the upload finished would send sync-zaturn.yml after an asset that is
      # not there yet. `if: success()` is implicit, so a failed build never dispatches.
      - name: Tell suin.uk a new pair is published
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          DISPATCH_TOKEN: ${{ secrets.SUIN_UK_PAT }}
        run: |
          set -e
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "SUIN_UK_PAT is unset; suin.uk will not learn about ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            https://api.github.com/repos/suinevere/suin-uk/dispatches \
            -d "{\"event_type\":\"zaturn-release\",\"client_payload\":{\"tag\":\"${GITHUB_REF_NAME}\"}}")
          echo "dispatch HTTP $code"
          if [ "$code" != "204" ]; then
            cat /tmp/dispatch.out >&2
            echo "403 here means the PAT lacks Contents: read and write on suinevere/suin-uk, or has expired" >&2
            exit 1
          fi
