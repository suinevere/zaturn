services:
  multizork:
    build:
      context: .
      dockerfile: Dockerfile
    image: multizorkd:latest
    container_name: multizork
    restart: unless-stopped
    ports:
      - "23:2323"
      - "2323:2323"
    volumes:
      # Bind mount, not a named volume: the transcripts site runs under host
      # nginx and has to read multizork.sqlite3 from here. Must be owned by
      # uid 1000, the container's unprivileged user.
      - ${MULTIZORK_DATA:-/srv/multizork}:/data
    stdin_open: true
    tty: true
