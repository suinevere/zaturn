server {
        listen 80 default_server;
        listen [::]:80 default_server;

        root /var/www/html;
        index index.html index.htm index.nginx-debian.html;

        server_name suinevere.duckdns.org;

        # Keep ACME challenge local for Certbot verification
        location /.well-known/acme-challenge/ {
                root /var/www/html;
        }

        location /zork {
#           try_files /zork.netbin =404;
            try_files $uri $uri/ =404;
                # Match any .netbin file inside /zork
#               location ~* \.netbin$ {

                proxy_http_version 1.1;
                sendfile off;
                send_timeout 600s;
                keepalive_timeout 300s 300s;
                gzip off;
                default_type application/x-planetweb-app-segasaturn;
                   add_header Content-Disposition 'attachment; filename=zork';
            add_header Cache-Control "no-store, no-cache, must-revalidate";
#               }
        }

        # Transcripts are HTTPS-only: the daemon hands out https URLs.
        location ~ ^/(game|player|rawplayer)(/|$) {
                return 301 https://$host$request_uri;
        }

        # Proxy all other traffic to GitHub Pages
        location / {
                proxy_pass https://suinevere.github.io/suinevere-site/;

                proxy_set_header Host suinevere.github.io;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_ssl_server_name on;
                proxy_ssl_protocols TLSv1.2 TLSv1.3;
        }
}

server {
    root /var/www/html;

    listen 443 ssl default_server; # managed by Certbot
    listen [::]:443 ssl default_server;
    server_name suinevere.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/suinevere.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/suinevere.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location /zork {
             try_files $uri $uri/ =404;
#            try_files /zork.netbin =404;

           # Match any .netbin file inside /zork
           location ~* \.netbin$ {
               default_type application/octet-stream;
               add_header Content-Disposition 'attachment';
               add_header Cache-Control "no-store, no-cache, must-revalidate";
           }
        }

    # multizork transcripts: /game/<room>, /player/<room>/<id> and
    # /rawplayer/<room>/<id>, all served by the one PHP file.
    #
    # No fastcgi_split_path_info here, deliberately. The router in that file
    # reads $_SERVER['PHP_SELF'] and splits it on '/', so it needs PHP_SELF to
    # be the bare request path. Without a path-info split $fastcgi_script_name
    # is $uri, which is exactly that; add a split and $operation becomes
    # "index.php" and every transcript URL 404s. SCRIPT_FILENAME is therefore
    # spelled out rather than built from $document_root.
    location ~ ^/(game|player|rawplayer)(/|$) {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/multizork/transcripts.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/multizork;
        fastcgi_param MULTIZORK_DB    /srv/multizork/multizork.sqlite3;

        # The site answers a failure with a status and no body, on purpose.
        # Without this nginx passes the empty body straight through and the
        # visitor gets a blank page instead of an error page.
        fastcgi_intercept_errors on;
    }

    error_page 404 /404.html;
    error_page 503 /503.html;
    location = /404.html { root /var/www/html; internal; }
    location = /503.html { root /var/www/html; internal; }

    location / {
        proxy_pass https://suinevere.github.io/suinevere-site/;

        proxy_set_header Host suinevere.github.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }
}
